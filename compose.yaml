services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: estate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-estate}
      POSTGRES_DB: estate
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["estate_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estate"]
      interval: 5s
      retries: 10
volumes:
  estate_data:
